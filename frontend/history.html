<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Audit History - EduShield</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>
    <div id="navbar-mount"></div>

    <div class="container py-4">
        <!-- Header -->
        <div class="row g-4 mb-4">
            <div class="col-12">
                <div class="glass-card p-4 border-start border-5 border-primary shadow-sm d-flex flex-column flex-md-row justify-content-between align-items-md-center">
                    <div>
                        <h3 class="fw-bold font-outfit mb-1">Assessment Audit History</h3>
                        <p class="text-muted small mb-0">Persistent audit logs stored in <strong>MongoDB Atlas</strong></p>
                    </div>
                    <div class="mt-3 mt-md-0 d-flex gap-2">
                        <button class="btn btn-outline-success fw-bold px-3 py-2 rounded-pill" onclick="exportCsv()">
                            <i class="fas fa-file-csv me-1"></i> Export CSV
                        </button>
                        <a href="predict.html" class="btn btn-primary fw-bold px-4 py-2 rounded-pill shadow-sm">
                            <i class="fas fa-plus me-1"></i> New Assessment
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filter & Search Toolbar -->
        <div class="glass-card p-3 shadow-sm mb-4">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search by student name or student ID...">
                    </div>
                </div>
                <div class="col-md-4">
                    <select id="riskFilter" class="form-select">
                        <option value="">All Risk Levels</option>
                        <option value="High">High Risk Only</option>
                        <option value="Medium">Medium Risk Only</option>
                        <option value="Low">Low Risk Only</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-secondary w-100 rounded-pill" onclick="loadHistory(0)">
                        <i class="fas fa-filter me-1"></i> Filter
                    </button>
                </div>
            </div>
        </div>

        <!-- Audit Table -->
        <div class="glass-card p-4 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Student</th>
                            <th>Student ID</th>
                            <th>Prediction</th>
                            <th>Probability</th>
                            <th>Risk Bracket</th>
                            <th>Analyst</th>
                            <th>Timestamp</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr>
                            <td colspan="8" class="text-center py-4 text-muted">
                                <i class="fas fa-spinner fa-spin me-2"></i>Loading audit logs from MongoDB Atlas...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination Bar -->
            <div class="d-flex justify-content-between align-items-center mt-4">
                <span class="small text-muted" id="paginationInfo">Showing 0 of 0 records</span>
                <div class="btn-group" id="paginationButtons"></div>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="modalStudentTitle"><i class="fas fa-user-graduate text-primary me-2"></i>Student Assessment Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body py-4" id="modalDetailsBody">
                    <div class="text-center py-3"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <a href="#" id="modalPdfLink" target="_blank" class="btn btn-outline-danger rounded-pill px-4">
                        <i class="fas fa-file-pdf me-2"></i> Download Official PDF
                    </a>
                    <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script>
        let currentOffset = 0;
        const limit = 15;

        async function loadHistory(offset = 0) {
            currentOffset = offset;
            const search = document.getElementById('searchInput').value.trim();
            const risk_level = document.getElementById('riskFilter').value;
            const tbody = document.getElementById('historyTableBody');

            tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-muted"><i class="fas fa-spinner fa-spin me-2"></i>Loading...</td></tr>`;

            try {
                const res = await API.getPredictions({ search, risk_level, limit, offset });
                const list = res.predictions || [];
                const total = res.total_count || 0;

                document.getElementById('paginationInfo').textContent = `Showing ${list.length} of ${total} records`;

                if (list.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-muted">No assessment records found.</td></tr>`;
                    return;
                }

                tbody.innerHTML = list.map(p => `
                    <tr>
                        <td class="fw-bold">${p.student_name || 'Anonymous Student'}</td>
                        <td><code>${p.student_id || 'N/A'}</code></td>
                        <td>
                            <span class="badge ${p.prediction === 'At Risk' ? 'bg-danger-subtle text-danger border border-danger-subtle' : 'bg-success-subtle text-success border border-success-subtle'} px-3 py-1 rounded-pill">
                                ${p.prediction}
                            </span>
                        </td>
                        <td>${(p.probability * 100).toFixed(1)}%</td>
                        <td>
                            <span class="badge ${p.risk_level === 'High' ? 'bg-danger' : (p.risk_level === 'Medium' ? 'bg-warning text-dark' : 'bg-success')} rounded-pill px-3 py-1">
                                ${p.risk_level}
                            </span>
                        </td>
                        <td><small class="text-muted"><i class="fas fa-user-shield me-1"></i>${p.analyst_name || 'System'}</small></td>
                        <td class="small text-muted">${p.created_at || 'Recent'}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-light border rounded-pill me-1" onclick="viewDetails(${p.id})">
                                <i class="fas fa-eye text-primary"></i>
                            </button>
                            <a href="${CONFIG.API_BASE_URL}/prediction/pdf/${p.id}" target="_blank" class="btn btn-sm btn-light border rounded-pill me-1" title="PDF Report">
                                <i class="fas fa-file-pdf text-danger"></i>
                            </a>
                            <button class="btn btn-sm btn-light border rounded-pill" onclick="deleteRecord(${p.id})" title="Delete">
                                <i class="fas fa-trash text-muted"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

                // Render pagination buttons
                const btnContainer = document.getElementById('paginationButtons');
                const prevDisabled = offset <= 0 ? 'disabled' : '';
                const nextDisabled = offset + limit >= total ? 'disabled' : '';
                btnContainer.innerHTML = `
                    <button class="btn btn-sm btn-outline-secondary" ${prevDisabled} onclick="loadHistory(${Math.max(0, offset - limit)})">
                        <i class="fas fa-chevron-left me-1"></i>Previous
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" ${nextDisabled} onclick="loadHistory(${offset + limit})">
                        Next<i class="fas fa-chevron-right ms-1"></i>
                    </button>
                `;
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger"><i class="fas fa-triangle-exclamation me-2"></i>Failed to load records: ${err.message}</td></tr>`;
            }
        }

        async function viewDetails(id) {
            const modal = new bootstrap.Modal(document.getElementById('detailsModal'));
            modal.show();
            const body = document.getElementById('modalDetailsBody');
            body.innerHTML = '<div class="text-center py-3"><i class="fas fa-spinner fa-spin fa-2x text-primary"></i></div>';

            try {
                const p = await API.getPrediction(id);
                document.getElementById('modalStudentTitle').innerHTML = `<i class="fas fa-user-graduate text-primary me-2"></i>${p.student_name} (${p.student_id})`;
                document.getElementById('modalPdfLink').href = `${CONFIG.API_BASE_URL}/prediction/pdf/${p.id}`;

                body.innerHTML = `
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <div class="p-3 bg-light rounded text-center">
                                <span class="d-block small text-muted">Predicted Outcome</span>
                                <strong class="fs-5 ${p.prediction === 'At Risk' ? 'text-danger' : 'text-success'}">${p.prediction}</strong>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3 bg-light rounded text-center">
                                <span class="d-block small text-muted">Dropout Probability</span>
                                <strong class="fs-5">${(p.probability * 100).toFixed(1)}%</strong>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3 bg-light rounded text-center">
                                <span class="d-block small text-muted">Confidence Score</span>
                                <strong class="fs-5 text-primary">${p.confidence}%</strong>
                            </div>
                        </div>
                    </div>
                    <h6 class="fw-bold mb-2">Targeted Action Plan:</h6>
                    <ul class="list-group mb-3">
                        ${(p.recommendations || []).map(r => `<li class="list-group-item"><i class="fas fa-check-circle text-success me-2"></i>${r}</li>`).join('')}
                    </ul>
                    <p class="small text-muted mb-0">Record evaluated by <strong>${p.analyst_name || 'Analyst'}</strong> on ${p.created_at}.</p>
                `;
            } catch (e) {
                body.innerHTML = `<div class="alert alert-danger">Error: ${e.message}</div>`;
            }
        }

        async function deleteRecord(id) {
            if (!confirm("Are you sure you want to delete this prediction record from MongoDB Atlas?")) return;
            try {
                await API.deletePrediction(id);
                loadHistory(currentOffset);
            } catch (err) {
                alert("Failed to delete record: " + err.message);
            }
        }

        function exportCsv() {
            const search = document.getElementById('searchInput').value.trim();
            const risk_level = document.getElementById('riskFilter').value;
            window.location.href = `${CONFIG.API_BASE_URL}/history/export?search=${encodeURIComponent(search)}&risk_level=${encodeURIComponent(risk_level)}`;
        }

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') loadHistory(0);
        });

        document.addEventListener("DOMContentLoaded", () => loadHistory(0));
    </script>
</body>
</html>
