{% extends "base.html" %}

{% block title %}Register - EduShield{% endblock %}

{% block page_header %}
<!-- Spacer to replace hero header on auth pages -->
<div class="py-4"></div>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="glass-card p-5 shadow-lg border-0 anim-delay-1" style="background: rgba(255, 255, 255, 0.9);">
            <div class="text-center mb-4">
                <div class="text-secondary mb-3" style="font-size: 3rem;"><i class="fas fa-user-plus"></i></div>
                <h3 class="fw-bold font-outfit text-dark">Create Account</h3>
                <p class="text-muted small">Register a new analyst account on the EduShield platform</p>
            </div>
            
            <form action="{{ url_for('register') }}" method="POST">
                <!-- Username Input -->
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold small text-muted"><i class="fas fa-user me-1"></i> Username</label>
                    <input type="text" name="username" id="username" class="form-control py-2" placeholder="Create username" style="border-radius: var(--radius-md);" required autofocus>
                </div>
                
                <!-- Email Input -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold small text-muted"><i class="fas fa-envelope me-1"></i> Email Address</label>
                    <input type="email" name="email" id="email" class="form-control py-2" placeholder="Enter your email" style="border-radius: var(--radius-md);" required>
                </div>
                
                <!-- Password Input -->
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold small text-muted"><i class="fas fa-lock me-1"></i> Password</label>
                    <input type="password" name="password" id="password" class="form-control py-2" placeholder="Create password" style="border-radius: var(--radius-md);" required>
                </div>
                
                <!-- Role Choice Selection -->
                <div class="mb-4">
                    <label for="role" class="form-label fw-bold small text-muted"><i class="fas fa-user-tag me-1"></i> Access Role</label>
                    <select name="role" id="role" class="form-select py-2" style="border-radius: var(--radius-md);" required>
                        <option value="user" selected>Regular Analyst (User Dashboard)</option>
                        <option value="admin">Platform Administrator (Admin Dashboard)</option>
                    </select>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="btn btn-secondary w-100 py-3 fw-bold mb-3 shadow-sm" style="border-radius: var(--radius-md);">
                    <i class="fas fa-user-plus me-2"></i> Register Account
                </button>
            </form>
            
            <div class="text-center mt-3 border-top pt-3">
                <span class="text-muted small">Already have an account? </span>
                <a href="{{ url_for('login') }}" class="fw-bold small text-secondary" style="text-decoration: none;">Log in here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
